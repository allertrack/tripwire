<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tripwire Live Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07090d; --panel:#0e131b; --ink:#eef1f6; --muted:#8f98aa; --line:#1f2733; --accent:#7c9cff; --ok:#3ccf96; --bad:#ff6b78; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; }
  header { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  header b { font-size: 22px; letter-spacing: -.01em; }
  .pill { font-size: 15px; color: var(--muted); background: #121926; border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px #12302a; }
  .spacer { flex: 1; }
  main { display: flex; height: 900px; }
  .left { width: 1210px; height: 900px; overflow: hidden; border-right: 1px solid var(--line); position: relative; }
  .left iframe { position: absolute; left: 0; top: 0; width: 1240px; height: 923px; border: 0; transform: scale(0.975); transform-origin: 0 0; }
  .right { flex: 1; display: flex; flex-direction: column; background: #05070a; }
  .right .bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }
  .right .bar i { width: 11px; height: 11px; border-radius: 50%; background: #262f3d; display: inline-block; }
  #term { flex: 1; padding: 14px 18px; font: 15.5px/1.5 "JetBrains Mono", monospace; color: #c9d1de; overflow: hidden; white-space: pre-wrap; word-break: break-all; display: flex; flex-direction: column; justify-content: flex-end; }
  #term .cmd { color: var(--accent); } #term .bad { color: var(--bad); font-weight: 700; } #term .ok { color: var(--ok); font-weight: 700; } #term .dim { color: #6b7486; }
  footer { height: 116px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 22px; padding: 0 28px; }
  #step { font-size: 22px; font-weight: 800; color: var(--bg); background: var(--accent); border-radius: 12px; min-width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
  #caption { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
  #caption span { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<header>
  <b>Tripwire</b>
  <span class="pill live"><i></i>Live on Monad testnet</span>
  <span class="pill">Chainlink CRE workflow · real transactions</span>
  <div class="spacer"></div>
  <span class="pill" id="clock"></span>
</header>
<main>
  <div class="left"><iframe id="dash" src="/?deployment=./deployment.capture.json"></iframe></div>
  <div class="right"><div class="bar"><i></i><i></i><i></i>&nbsp; terminal</div><div id="term"></div></div>
</main>
<footer><div id="step">0</div><div id="caption">Starting…</div></footer>
<script>
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  const term = document.getElementById('term')
  window.__line = (text, cls = '') => {
    const div = document.createElement('div')
    if (cls) div.className = cls
    div.innerHTML = esc(text)
    term.appendChild(div)
    while (term.children.length > 60) term.removeChild(term.firstChild)
  }
  window.__caption = (n, html) => { document.getElementById('step').textContent = n; document.getElementById('caption').innerHTML = html }
  window.__scrollDash = (y) => document.getElementById('dash').contentWindow.scrollTo({ top: y, behavior: 'smooth' })
  setInterval(() => { document.getElementById('clock').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC' }, 250)
</script>
</body>
</html>
